version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: .lazycat-build/kikoeru.lpk
  target_arch: amd64

update:
  strategy: publish
  version_source:
    type: image
    image: kikoeru
    bump: patch

build:
  run_buildscript: false

images:
  - id: kikoeru
    target: service
    service: kikoeru
    source: vscodev/neokikoeru
    channel: custom
    sort: created
    tag_regex: '^latest$'
    delivery:
      mode: mirror
      require_digest_match: true

stores:
  official:
    enabled: false
  private:
    enabled: true
    skip_if_version_exists: true
    name: Kikoeru
    summary: "自托管 DLsite 音声作品整理与播放器"
